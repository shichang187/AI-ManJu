name: Workbench tests
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Check executable dependencies
        run: python -B Novel2ComicDrama/scripts/doctor.py
      - name: Run isolated parser, API and media regressions
        env:
          AIMANJU_REQUIRE_MEDIA_TESTS: '1'
        run: python -B -m unittest discover -s Novel2ComicDrama/tests -v
