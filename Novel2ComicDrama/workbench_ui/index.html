<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI漫剧工作台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #f3f4f6;
      color: #1f2430;
      min-height: 100vh;
    }
    header {
      background: #10141c;
      color: #f8fafc;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; }
    header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
    section {
      background: #ffffff;
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    h2 {
      font-size: 15px;
      color: #111827;
      margin-bottom: 12px;
      border-left: 4px solid #2563eb;
      padding-left: 10px;
      letter-spacing: 0;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid #cbd2dc;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fbfcfe;
      color: #111827;
      outline: none;
    }
    textarea:focus, input:focus, select:focus { border-color: #2563eb; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .field label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    button {
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid #2563eb;
      background: #2563eb;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      letter-spacing: 0;
    }
    button.secondary { background: #fff; color: #2563eb; }
    button.dark { background: #111827; border-color: #111827; }
    button.danger { background: #dc2626; border-color: #dc2626; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .expanded {
      background: #f0f4ff;
      border: 1px solid #dbe4ff;
      border-radius: 6px;
      padding: 12px;
      line-height: 1.8;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }
    .chat {
      margin-top: 14px;
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      padding: 14px;
      background: #fafbfc;
    }
    .chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow: auto; }
    .bubble {
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .bubble.ai { background: #eef2ff; color: #1e1b4b; align-self: flex-start; }
    .bubble.user { background: #dbeafe; color: #172554; align-self: flex-end; }
    .chat-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chat-options button { background: #fff; color: #1f2937; border-color: #cbd2dc; }
    .chat-options button:hover { border-color: #2563eb; color: #2563eb; }
    .custom-wrap { display: flex; gap: 8px; margin-top: 10px; }
    .custom-wrap input { flex: 1; }
    .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
    .shot-card {
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .shot-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e5ea;
      flex-wrap: wrap;
    }
    .shot-head strong { font-size: 14px; }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
    }
    .badge.action { background: #fff1f2; color: #9f1239; }
    .badge.empty { background: #ecfeff; color: #155e75; }
    .shot-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .shot-desc { line-height: 1.7; color: #1f2937; font-size: 14px; }
    .shot-line { font-size: 12px; color: #6b7280; line-height: 1.6; }
    details {
      margin-top: 4px;
      border-top: 1px dashed #e5e7eb;
      padding-top: 8px;
    }
    summary { font-size: 13px; color: #2563eb; cursor: pointer; }
    .prompt {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.8;
      color: #374151;
      background: #f9fafb;
      border-radius: 6px;
      padding: 10px;
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .project-box {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      line-height: 1.8;
      font-size: 14px;
      word-break: break-all;
    }
    .video-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }
    .video-list li {
      font-size: 13px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 10px;
    }
    .progress-wrap {
      margin-top: 14px;
      display: none;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px;
    }
    .progress-bar {
      height: 14px;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 999px;
      transition: width 0.6s ease;
      min-width: 8px;
    }
    .progress-text { margin-top: 8px; font-size: 13px; color: #334155; }
    .result {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.8;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 12px;
      word-break: break-all;
      display: none;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99;
    }
    #toast.show { opacity: 1; }
    @media (max-width: 720px) {
      header { padding: 14px 16px; }
      main { padding: 14px 10px 40px; }
      section { padding: 14px; }
      .shots { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/assets/prompt-library.css">
<link rel="stylesheet" href="/assets/upgrade.css"></head>
<body>
  <header>
    <span class="dot"></span>
    <h1>AI漫剧工作台</h1>
  </header>

  <main>
    <section>
      <h2>故事输入</h2>
      <textarea id="storyInput" placeholder="输入简短故事，例如：少年在雨夜追一个神秘人"></textarea>
      <div class="grid">
        <div class="field">
          <label>主角名</label>
          <input id="subject" placeholder="主角">
        </div>
        <div class="field">
          <label>角色设定</label>
          <input id="characterDesc" placeholder="留空使用统一人设描述">
        </div>
        <div class="field">
          <label>风格</label>
          <select id="style">
            <option>通用</option>
            <option>热血动作</option>
            <option>情感叙事</option>
            <option>唯美空镜</option>
            <option>悬念反转</option>
          </select>
        </div>
        <div class="field">
          <label>镜头数</label>
          <input id="shotCount" type="number" min="1" max="300" value="5">
        </div>
        <div class="field">
          <label>最短时长（秒）</label>
          <input id="minSec" type="number" min="1" max="10" value="3">
        </div>
        <div class="field">
          <label>最长时长（秒）</label>
          <input id="maxSec" type="number" min="1" max="10" value="6">
        </div>
      </div>
      <div class="actions">
        <button onclick="startInterview()">开始创作</button>
        <button class="secondary" onclick="expandStory()">扩写并分镜</button>
        <button class="secondary" onclick="copyAll()">复制全部分镜</button>
        <button class="secondary" onclick="downloadJson()">下载分镜 JSON</button>
        <button class="secondary" onclick="saveStoryboard()">保存到项目</button>
        <button class="dark" onclick="openDoubao()">打开豆包</button>
        <button class="danger" onclick="resetAll()">重置</button>
      </div>
      <div class="chat">
        <div id="chatLog" class="chat-log"></div>
        <div id="chatOptions" class="chat-options"></div>
        <div id="customWrap" class="custom-wrap" hidden>
          <input id="customAnswer" placeholder="输入你的答案">
          <button onclick="confirmCustomAnswer()">确认</button>
        </div>
      </div>
    </section>

    <section id="promptLibrary" aria-label="提示词工坊"></section>

    <section id="storyboardSection" style="display:none">
      <h2>分镜脚本</h2>
      <div id="expandedText" class="expanded"></div>
      <div id="shotList" class="shots"></div>
    </section>

    <section>
      <h2>项目文件夹</h2>
      <div class="actions">
        <button onclick="createProject()">确定分镜无误</button>
        <button class="secondary" onclick="openProjectFolder()">打开视频文件夹</button>
      </div>
      <div id="projectInfo" class="project-box"></div>
    </section>

    <section>
      <h2>视频合成</h2>
      <div class="grid">
        <div class="field">
          <label>背景音乐路径（可选）</label>
          <input id="bgmPath" placeholder="留空则不使用BGM">
        </div>
      </div>
      <div class="shot-line" style="margin-top:12px">视频可按镜头 ID 命名，也可在下方手动选择对应素材</div>
      <div class="actions">
        <button class="secondary" onclick="refreshVideos()">刷新视频</button>
        <button id="composeBtn" onclick="composeVideo()" disabled>合成最终视频</button>
      </div>
      <div id="progressWrap" class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
        <div id="progressText" class="progress-text">0% 排队中</div>
      </div>
      <div id="videoDir" class="shot-line"></div>
      <ul id="videoList" class="video-list"></ul>
      <div id="composeResult" class="result"></div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    const QUESTIONS = [
      { key: "location", q: "这个故事发生在哪里？", options: ["城市雨夜", "学校天台", "森林", "海边", "室内房间", "自定义"] },
      { key: "time_of_day", q: "时间段和光线呢？", options: ["白天", "黄昏", "夜晚", "黎明", "自定义"] },
      { key: "mood", q: "核心情绪是什么？", options: ["情感治愈", "热血爆发", "悬疑反转", "唯美空镜", "浪漫", "自定义"] },
      { key: "creative_point", q: "最想保留的创意点是什么？", options: ["一个关键物品", "一句台词", "一段回忆", "视觉反转", "自定义"] },
      { key: "key_shot", q: "最想突出的画面重点是什么？", options: ["人物特写", "动作追逐", "环境空镜", "对话场面", "自定义"] }
    ];

    const state = {
      storyboard: null,
      projectFolder: "",
      projectOpened: false,
      lastFinalPath: "",
      interview: { answers: {}, done: false },
      inputs: {}
    };
    let interviewStep = 0;
    let progressTimer = null;

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    async function api(path, body) {
      const options = { method: "GET", headers: {"X-Workbench-Session": document.querySelector('meta[name="workbench-session"]')?.content || ""} };
      if (body !== undefined) {
        options.method = "POST";
        options.headers["Content-Type"] = "application/json"; if(path === "/api/save-storyboard") body = {storyboard:body, project_id:state.projectId || undefined, revision:state.projectId ? state.revision : undefined}; if(state.projectId && !body.project_id && path !== "/api/select-project") body.project_id=state.projectId;
        options.body = JSON.stringify(body);
      }
      const res = await fetch(path, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "请求失败");
      if(data.revision !== undefined) state.revision=data.revision; if(data.project_id) state.projectId=data.project_id; return data;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    const typeLabel = { dialogue: "对话", action: "动作", empty: "空镜" };

    function collectInputs() {
      return {
        text: document.getElementById("storyInput").value.trim(),
        style: document.getElementById("style").value,
        subject: document.getElementById("subject").value.trim(),
        character_desc: document.getElementById("characterDesc").value.trim(),
        target_shots: Number(document.getElementById("shotCount").value || 5),
        min_sec: Number(document.getElementById("minSec").value || 3),
        max_sec: Number(document.getElementById("maxSec").value || 6)
      };
    }

    function saveState() {
      state.inputs = collectInputs();
      localStorage.setItem("aiManjuWorkbench", JSON.stringify(state));
      api("/api/state", {
        state: {
          storyboard: state.storyboard,
          project_folder: state.projectFolder,
          project_opened: state.projectOpened,
          inputs: state.inputs,
          interview: state.interview
        }
      }).catch(() => {});
    }

    function addChat(role, text) {
      const log = document.getElementById("chatLog");
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function renderOptions(options, onSelect) {
      const box = document.getElementById("chatOptions");
      box.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          if (opt === "自定义") {
            const wrap = document.getElementById("customWrap");
            wrap.hidden = false;
            document.getElementById("customAnswer").focus();
          } else {
            onSelect(opt);
          }
        };
        box.appendChild(btn);
      });
    }

    function startInterview() {
      state.interview = { answers: {}, done: false };
      document.getElementById("chatLog").innerHTML = "";
      document.getElementById("chatOptions").innerHTML = "";
      interviewStep = 0;
      askQuestion(0);
      saveState();
    }

    function askQuestion(index) {
      interviewStep = index;
      if (index >= QUESTIONS.length) {
        finishInterview();
        return;
      }
      const q = QUESTIONS[index];
      addChat("ai", q.q);
      renderOptions(q.options, value => handleAnswer(index, value));
    }

    function handleAnswer(index, value) {
      const key = QUESTIONS[index].key;
      state.interview.answers[key] = value;
      addChat("user", value);
      document.getElementById("chatOptions").innerHTML = "";
      document.getElementById("customWrap").hidden = true;
      askQuestion(index + 1);
      saveState();
    }

    function confirmCustomAnswer() {
      const input = document.getElementById("customAnswer");
      const value = input.value.trim();
      if (!value) return;
      input.value = "";
      handleAnswer(interviewStep, value);
    }

    function finishInterview() {
      state.interview.done = true;
      const a = state.interview.answers;
      addChat("ai",
        `已确认：地点 ${a.location || "自动判断"}，时间 ${a.time_of_day || "自动判断"}，情绪 ${a.mood || "自动判断"}，创意点 ${a.creative_point || "自动补充"}，画面重点 ${a.key_shot || "自动判断"}。正在生成分镜...`);
      saveState();
      expandStory();
    }

    async function expandStory() {
      const inputs = collectInputs();
      if (!inputs.text) {
        toast("请输入故事内容");
        return;
      }
      const answers = state.interview.answers || {};
      const payload = {
        ...inputs,
        location: answers.location || "",
        time_of_day: answers.time_of_day || "",
        mood: answers.mood || "",
        creative_point: answers.creative_point || "",
        key_shot: answers.key_shot || ""
      };
      try {
        const res = await api("/api/expand", payload);
        state.storyboard = res.storyboard; state.projectId=""; state.projectFolder=""; state.projectOpened=false;
        renderStoryboard();
        saveState();
        toast("分镜已生成");
      } catch (e) {
        toast(e.message);
      }
    }

    function renderStoryboard() {
      const sb = state.storyboard;
      if (!sb) return;
      document.getElementById("storyboardSection").style.display = "";
      document.getElementById("expandedText").textContent =
        "环境锚点：" + (sb.environment_anchor || "统一环境") +
        "\n扩写：" + sb.expanded_text +
        "\n角色设定：" + sb.character_desc;

      const list = document.getElementById("shotList");
      list.innerHTML = "";
      sb.shots.forEach((shot, index) => {
        const card = document.createElement("div");
        card.className = "shot-card";
        const badgeClass = shot.shot_type === "action" ? "action" : shot.shot_type === "empty" ? "empty" : "";
        card.innerHTML = `
          <div class="shot-head">
            <strong>镜头 ${String(index + 1).padStart(2, "0")}</strong>
            <span class="badge">${shot.duration}s</span>
            <span class="badge ${badgeClass}">${typeLabel[shot.shot_type] || shot.shot_type}</span>
            <button class="secondary" onclick="copyShotPrompt(${index})">复制提示词</button>
            <button class="secondary" onclick="promptLibrary.browse(${index})">从提示词库选择</button>
          </div>
          <div class="shot-body">
            <div class="shot-desc">${escapeHtml(shot.description)}</div>
            <div class="shot-line">台词：${escapeHtml(shot.dialogue || "无")}</div>
            <div class="shot-line">旁白：${escapeHtml(shot.narration || "无")}</div>
            <details>
              <summary>提示词</summary>
              <div class="prompt">${escapeHtml(shot.prompt)}</div>
              <div class="prompt" style="margin-top:6px">负面：${escapeHtml(shot.negative_prompt)}</div>
            </details>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function buildCopyText() {
      const sb = state.storyboard;
      if (!sb) return "";
      const lines = [
        "【标题】" + sb.title,
        "【环境锚点】" + (sb.environment_anchor || "统一环境"),
        "【扩写】" + sb.expanded_text,
        "【角色设定】" + sb.character_desc,
        "",
      ];
      sb.shots.forEach((shot, index) => {
        lines.push(
          `镜头${index + 1}（${shot.duration}秒/${typeLabel[shot.shot_type] || shot.shot_type}）`,
          "画面：" + shot.description,
          shot.dialogue ? "台词：" + shot.dialogue : "",
          shot.narration ? "旁白：" + shot.narration : "",
          "提示词：" + shot.prompt,
          "负面提示词：" + shot.negative_prompt,
          ""
        );
      });
      return lines.join("\n");
    }

    async function copyAll() {
      const text = buildCopyText();
      if (!text) { toast("请先生成分镜"); return; }
      try {
        await navigator.clipboard.writeText(text);
        toast("全部分镜已复制");
      } catch (e) {
        toast("复制失败，请手动选择复制");
      }
    }

    async function copyShotPrompt(index) {
      const shot = state.storyboard && state.storyboard.shots[index];
      if (!shot) { toast("请先生成分镜"); return; }
      const text = [
        `镜头${index + 1}（${shot.duration}秒/${typeLabel[shot.shot_type] || shot.shot_type}）`,
        shot.description,
        "提示词：" + shot.prompt,
        "负面提示词：" + shot.negative_prompt,
      ].join("\n");
      try {
        await navigator.clipboard.writeText(text);
        toast(`镜头${index + 1}提示词已复制`);
      } catch (e) {
        toast("复制失败，请手动选择复制");
      }
    }

    function downloadJson() {
      if (!state.storyboard) { toast("请先生成分镜"); return; }
      const blob = new Blob([JSON.stringify(state.storyboard, null, 2)], {
        type: "application/json;charset=utf-8",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "storyboard.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    async function saveStoryboard() {
      if (!state.storyboard) { toast("请先生成分镜"); return; }
      try {
        const res = await api("/api/save-storyboard", state.storyboard);
        toast("已保存：" + res.storyboard_path);
      } catch (e) {
        toast(e.message);
      }
    }

    async function createProject() {
      if (!state.storyboard) { toast("请先生成分镜"); return; }
      try {
        const res = await api("/api/create-project", { storyboard: state.storyboard });
        state.projectFolder = res.project_folder;
        state.projectOpened = false;
        document.getElementById("projectInfo").textContent = "项目文件夹：" + res.project_folder;
        saveState();
        updateComposeBtn();
        toast("项目文件夹已创建");
      } catch (e) {
        toast(e.message);
      }
    }

    async function openProjectFolder() {
      if (!state.projectFolder) { toast("请先确定分镜无误"); return; }
      try {
        const res = await api("/api/open-folder", { folder: state.projectFolder });
        state.projectFolder = res.project_folder || state.projectFolder;
        state.projectOpened = true;
        saveState();
        updateComposeBtn();
        toast("项目文件夹已打开");
      } catch (e) {
        toast(e.message);
      }
    }

    function openDoubao() {
      window.open("https://www.doubao.com/chat/", "_blank");
    }

    function resetAll() {
      if (!window.confirm("确认重置？当前分镜、访谈和项目状态会被清空，已生成的文件不会删除。")) return;
      (async () => {
        try {
          await api("/api/reset", {});
        } catch (e) { toast("重置失败："+e.message); return; }
        state.storyboard = null; state.projectId="";
        state.projectFolder = "";
        state.projectOpened = false;
        state.lastFinalPath = "";
        state.interview = { answers: {}, done: false };
        state.inputs = {};
        localStorage.removeItem("aiManjuWorkbench");
        document.getElementById("storyInput").value = "";
        document.getElementById("subject").value = "";
        document.getElementById("characterDesc").value = "";
        document.getElementById("style").value = "通用";
        document.getElementById("shotCount").value = 5;
        document.getElementById("minSec").value = 3;
        document.getElementById("maxSec").value = 6;
        document.getElementById("bgmPath").value = "";
        document.getElementById("chatLog").innerHTML = "";
        document.getElementById("chatOptions").innerHTML = "";
        document.getElementById("customWrap").hidden = true;
        document.getElementById("storyboardSection").style.display = "none";
        document.getElementById("shotList").innerHTML = "";
        document.getElementById("expandedText").textContent = "";
        document.getElementById("projectInfo").textContent = "";
        document.getElementById("composeResult").style.display = "none";
        document.getElementById("composeResult").innerHTML = "";
        document.getElementById("progressWrap").style.display = "none";
        document.getElementById("progressBar").style.width = "0%";
        document.getElementById("videoDir").textContent = "";
        document.getElementById("videoList").innerHTML = "";
        updateComposeBtn();
        refreshVideos();
        toast("已重置，可以开始新项目");
      })();
    }

    async function refreshVideos() {
      try {
        const res = await api("/api/videos");
        if (res.need_project) {
          document.getElementById("videoDir").textContent = "请先确定分镜无误并打开项目文件夹";
        } else {
          document.getElementById("videoDir").textContent = "视频目录：" + res.videos_dir;
        }
        const list = document.getElementById("videoList");
        list.innerHTML = "";
        if (!res.videos.length) {
          list.innerHTML = "<li>暂无视频</li>";
        } else {
          res.videos.forEach(v => {
            const li = document.createElement("li");
            li.textContent = `${v.filename}（${v.size_mb}MB）`;
            list.appendChild(li);
          });
        }
        toast(`找到 ${res.count} 个视频`);
        updateComposeBtn();
      } catch (e) {
        toast(e.message);
      }
    }

    async function composeVideo() {
      const btn = document.getElementById("composeBtn");
      if (!state.projectFolder || !state.projectOpened) {
        toast("请先确定分镜无误并打开视频文件夹");
        return;
      }
      const videosRes = await api("/api/videos");
      const shotCount = (state.storyboard && state.storyboard.shots
        ? state.storyboard.shots.length : 5);
      if (!videosRes.count) {
        toast("项目文件夹中没有视频，请先放入编号视频");
        return;
      }
      if (videosRes.count < shotCount) {
        const ok = window.confirm(
          `当前只有 ${videosRes.count} 个视频，分镜是 ${shotCount} 个，是否继续合成？`
        );
        if (!ok) return;
      }
      btn.disabled = true;
      document.getElementById("progressWrap").style.display = "block";
      document.getElementById("progressBar").style.width = "2%";
      document.getElementById("progressText").textContent = "0% 排队中；可以刷新恢复任务状态";
      try {
        const res = await api("/api/compose", {
          bgm_path: document.getElementById("bgmPath").value.trim(),
          bgm_volume: 0.15,
        });
        pollProgress(res.task_id);
      } catch (e) {
        btn.disabled = false;
        toast(e.message);
      }
    }

    async function pollProgress(taskId) {
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = setInterval(async () => {
        try {
          const p = await api("/api/compose-progress?task_id=" + encodeURIComponent(taskId));
          const percent = Math.max(2, p.progress || 0);
          document.getElementById("progressBar").style.width = percent + "%";
          document.getElementById("progressText").textContent = `${percent}% ${p.step || ""}；可以刷新恢复任务状态`;
          if (p.status === "done") {
            clearInterval(progressTimer);
            document.getElementById("progressBar").style.width = "100%";
            document.getElementById("progressText").textContent = "100% 合成完成";
            const box = document.getElementById("composeResult");
            box.style.display = "block";
            state.lastFinalPath = p.final_path;
            box.innerHTML =
              "合成完成：" + escapeHtml(p.final_path) +
              '<br><button class="secondary" style="margin-top:10px" onclick="openFinalVideo()">打开视频</button>';
            document.getElementById("composeBtn").disabled = false;
            updateComposeBtn();
            toast("合成完成");
          } else if (p.status === "error") {
            clearInterval(progressTimer);
            document.getElementById("composeBtn").disabled = false;
            toast(p.error || "合成失败");
          }
        } catch (e) {
          clearInterval(progressTimer);
          document.getElementById("composeBtn").disabled = false;
          toast(e.message);
        }
      }, 1000);
    }

    function restoreInputs(inputs) {
      if (!inputs) return;
      document.getElementById("storyInput").value = inputs.text || "";
      document.getElementById("subject").value = inputs.subject || "";
      document.getElementById("characterDesc").value = inputs.character_desc || "";
      document.getElementById("style").value = inputs.style || "通用";
      document.getElementById("shotCount").value = inputs.target_shots || 5; document.getElementById("minSec").value = inputs.min_sec || 3;
      document.getElementById("maxSec").value = inputs.max_sec || 6;
    }

    function renderProject() {
      if (state.projectFolder) {
        document.getElementById("projectInfo").textContent = "项目文件夹：" + state.projectFolder;
      }
    }

    function renderInterviewSummary() {
      if (!state.interview.done) return;
      const a = state.interview.answers;
      addChat("ai",
        `已确认：地点 ${a.location || "自动判断"}，时间 ${a.time_of_day || "自动判断"}，情绪 ${a.mood || "自动判断"}，创意点 ${a.creative_point || "自动补充"}，画面重点 ${a.key_shot || "自动判断"}。`);
    }

    function restoreInterview() {
      const answers = state.interview.answers || {};
      const keys = Object.keys(answers);
      if (!keys.length) return;
      if (state.interview.done) {
        renderInterviewSummary();
        return;
      }
      const nextIndex = QUESTIONS.findIndex(q => !answers[q.key]);
      if (nextIndex < 0) {
        state.interview.done = true;
        renderInterviewSummary();
        return;
      }
      addChat("ai", "已记录：" + keys.map(k => {
        const q = QUESTIONS.find(item => item.key === k);
        return (q ? q.q : k) + "：" + answers[k];
      }).join("；"));
      askQuestion(nextIndex);
    }

    async function restoreState() {
      try {
        const res = await api("/api/state");
        const s = res.state;
        if (s) {
          state.storyboard = s.storyboard || null;
          state.projectFolder = s.project_folder || "";
          state.inputs = s.inputs || {};
          state.interview = s.interview || { answers: {}, done: false };
          restoreInputs(state.inputs);
          state.projectOpened = s.project_opened || false;
          renderProject();
          if (state.storyboard) renderStoryboard();
          restoreInterview();
          updateComposeBtn();
          return;
        }
      } catch (e) {}
      const saved = localStorage.getItem("aiManjuWorkbench");
      if (saved) {
        try {
          const s = JSON.parse(saved);
          state.storyboard = s.storyboard || null;
          state.projectFolder = s.projectFolder || "";
          state.projectOpened = s.projectOpened || false;
          state.interview = s.interview || { answers: {}, done: false };
          restoreInputs(s.inputs);
          renderProject();
          if (state.storyboard) renderStoryboard();
          restoreInterview();
          updateComposeBtn();
        } catch (e) {}
      }
    }

    function updateComposeBtn() {
      document.getElementById("composeBtn").disabled =
        !(state.projectFolder && state.projectOpened);
    }

    async function openFinalVideo() {
      if (!state.lastFinalPath) { toast("还没有可打开的视频"); return; }
      try {
        await api("/api/open-file", { path: state.lastFinalPath });
      } catch (e) {
        toast(e.message);
      }
    }


  </script>
  <script src="/assets/upgrade.js"></script><script src="/assets/prompt-library.js"></script>
</body>
</html>
